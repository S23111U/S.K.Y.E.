<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.K.Y.E. - Phase 2 Final</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #cc4400;
            --secondary-color: #ff6600;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #fffbf4; 
            font-family: 'Orbitron', sans-serif; 
            transition: background-color 1s ease;
        }
        canvas { 
            display: block; 
            position: absolute;
            top: 0; left: 0; z-index: 1; 
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; 
            display: flex; flex-direction: column; 
            justify-content: space-between; align-items: center;
            padding: 40px; box-sizing: border-box;
        }

        #header-text {
            color: var(--primary-color);
            font-size: 18px; font-weight: 400; letter-spacing: 8px; 
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,0,0, 0.2); 
            margin-top: 50px;
            transition: color 1s ease;
        }

        #transcript-container {
            width: 80%; max-width: 800px; min-height: 60px;
            text-align: center; margin-bottom: 40px;
            display: flex; justify-content: center; align-items: flex-end;
        }

        #transcript-text {
            font-family: 'Share Tech Mono', monospace; 
            font-size: 16px; letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to bottom, var(--secondary-color), var(--primary-color));
            -background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 1s ease;
            text-shadow: 0 0 5px rgba(0,0,0, 0.1);
        }

        /* Clean Start Button */
        #start-btn {
            pointer-events: auto;
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        #start-btn:hover { background: var(--primary-color); color: white; }
        #start-btn.hidden { display: none; }

        .cursor {
            display: none; width: 8px; height: 16px;
            background-color: var(--secondary-color);
            margin-left: 5px; animation: blink 1s infinite;
            transition: background-color 1s ease;
        }
        .cursor.active { display: inline-block; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #status-corner {
            position: absolute; bottom: 30px; left: 30px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px;
            color: var(--primary-color); opacity: 0.5;
            border-left: 2px solid var(--primary-color); padding-left: 10px;
            text-align: left;
            transition: color 1s ease, border-color 1s ease;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="header-text">S.K.Y.E.</div>
        
        <div style="pointer-events: auto; margin-top: 20px; display: flex; flex-direction: column; align-items: center;">
            <div style="margin-bottom: 20px;">
                <button onclick="setMode('default')" style="background:none; border:1px solid #cc4400; color:#cc4400; padding:5px 10px; cursor:pointer;">DEFAULT</button>
                <button onclick="setMode('health')" style="background:none; border:1px solid #cc0000; color:#cc0000; padding:5px 10px; cursor:pointer;">HEALTH</button>
                <button onclick="setMode('knowledge')" style="background:none; border:1px solid #0088cc; color:#0088cc; padding:5px 10px; cursor:pointer;">KNOWLEDGE</button>
            </div>
            
            <button id="start-btn" onclick="initAudio()">INITIALIZE SYSTEMS</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- 0. CONFIGURATION & STATE ---
        const PALETTES = {
            default: { primary: new THREE.Color(0xcc4400), secondary: new THREE.Color(0xffaa44), atmosphere: new THREE.Color(0xff8844), cssPrim: '#cc4400', cssSec: '#ffaa44', fog: 0xffeedd },
            health: { primary: new THREE.Color(0xcc0000), secondary: new THREE.Color(0xff4444), atmosphere: new THREE.Color(0xff0000), cssPrim: '#cc0000', cssSec: '#ff4444', fog: 0xffdddd },
            knowledge: { primary: new THREE.Color(0x0044aa), secondary: new THREE.Color(0x0080FF), atmosphere: new THREE.Color(0x8899ff), cssPrim: '#0044aa', cssSec: '#00ffff', fog: 0xeef4ff }
        };

        let currentTarget = PALETTES.default;
        const activeMaterials = { primary: [], secondary: [], atmosphere: [] };

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xffeedd, 0.02); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 35; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const galaxy = new THREE.Group(); scene.add(galaxy);
        const atmosphereGroup = new THREE.Group(); scene.add(atmosphereGroup);

        // --- 2. ASSETS ---
        function getGlowSpriteTex() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64,64,0, 64,64,64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.85)'); grad.addColorStop(1, 'rgba(255, 255, 255, 0)'); 
            ctx.fillStyle = grad; ctx.fillRect(0,0,128,128); return new THREE.CanvasTexture(canvas);
        }
        
        const glowMat = new THREE.SpriteMaterial({ map: getGlowSpriteTex(), color: currentTarget.atmosphere, transparent: true, blending: THREE.NormalBlending });
        activeMaterials.atmosphere.push(glowMat);
        const glowSprite = new THREE.Sprite(glowMat); glowSprite.scale.set(70, 70, 1); glowSprite.position.z = -10; atmosphereGroup.add(glowSprite);

        function getCircuitTex() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 1.5;
            for(let i=0; i<25; i++) {
                const x = Math.random() * 256; const y = Math.random() * 256;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()*60-30), y + (Math.random()*60-30)); ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }
        const circuitTex = getCircuitTex();

        const shellGroup = new THREE.Group(); galaxy.add(shellGroup);
        function createPlate(radius, phiS, phiL, thetaS, thetaL) {
            const geo = new THREE.SphereGeometry(radius, 32, 32, phiS, phiL, thetaS, thetaL);
            const mat = new THREE.MeshBasicMaterial({ map: circuitTex, transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.NormalBlending, depthWrite: false, color: currentTarget.secondary });
            activeMaterials.secondary.push(mat);
            const mesh = new THREE.Mesh(geo, mat);
            const wireMat = new THREE.LineBasicMaterial({ color: currentTarget.primary, transparent: true, opacity: 0.3 });
            activeMaterials.primary.push(wireMat);
            mesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), wireMat));
            return mesh;
        }
        shellGroup.add(createPlate(12, 0, 2, 0, 1.5)); shellGroup.add(createPlate(12.2, 2.5, 1.5, 1, 2));
        shellGroup.add(createPlate(11.8, 4.5, 1.5, 0.5, 2.5)); shellGroup.add(createPlate(12.5, 1, 1, 2, 1));

        function createDistortedBrain(radius, detail, colorType, opacity) {
            const geo = new THREE.IcosahedronGeometry(radius, detail);
            const initColor = colorType === 'primary' ? currentTarget.primary : currentTarget.secondary;
            const mat = new THREE.MeshBasicMaterial({ color: initColor, wireframe: true, transparent: true, opacity: opacity, blending: THREE.NormalBlending, side: THREE.DoubleSide });
            if(colorType === 'primary') activeMaterials.primary.push(mat); else activeMaterials.secondary.push(mat);
            return new THREE.Mesh(geo, mat);
        }
        const brain1 = createDistortedBrain(7, 1, 'primary', 0.5); galaxy.add(brain1); 
        const brain2 = createDistortedBrain(8, 0, 'secondary', 0.4); galaxy.add(brain2);
        
        const coreGroup = new THREE.Group(); galaxy.add(coreGroup);
        const layers = [];
        for(let i=0; i<10; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: currentTarget.secondary, transparent: true, opacity: 0.1, side: THREE.FrontSide, depthWrite: false, blending: THREE.NormalBlending });
            activeMaterials.secondary.push(mat);
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.2 + (2.0 * (i/9)), 32, 32), mat);
            mesh.userData = { baseOpacity: 0.15, maxOpacity: 0.5 - (i * 0.03), index: i };
            coreGroup.add(mesh); layers.push(mesh);
        }

        const gimbalPivot = new THREE.Group(); galaxy.add(gimbalPivot);
        const gimbalPivot2 = new THREE.Group(); galaxy.add(gimbalPivot2);
        const gimbalSegments1 = []; const gimbalSegments2 = [];

        function createSegmentedArc(group, arr, r, angle, count, rotOff) {
            const segAngle = angle / count;
            for(let i = 0; i < count; i++) {
                const geo = new THREE.TorusGeometry(r, 0.4, 4, 6, segAngle);
                const mat = new THREE.MeshBasicMaterial({ color: currentTarget.primary, transparent: true, opacity: 0.1 });
                activeMaterials.primary.push(mat);
                const wireMat = new THREE.LineBasicMaterial({ color: currentTarget.secondary, opacity: 1.0, transparent: true });
                activeMaterials.secondary.push(wireMat);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), wireMat));
                const angPos = i * segAngle;
                mesh.rotation.z = angPos;
                mesh.userData = { index: i, total: count, radius: r, currentRadius: r, midAngle: angPos + (segAngle / 2) };
                group.add(mesh); arr.push(mesh);
            }
            group.rotation.z = rotOff; 
        }
        createSegmentedArc(gimbalPivot, gimbalSegments1, 15, Math.PI, 100, Math.PI/2);
        createSegmentedArc(gimbalPivot2, gimbalSegments2, 15, Math.PI, 100, -Math.PI/2);

        const beamGroup = new THREE.Group(); galaxy.add(beamGroup);
        const activeBeams = [];
        
        function generatePath() {
            const r1=2.0; const minR=4.0; const maxR=12.0;
            const theta1=Math.random()*Math.PI*2, phi1=Math.acos(2*Math.random()-1);
            const p1=new THREE.Vector3().setFromSphericalCoords(r1, phi1, theta1);
            const r3=minR+Math.random()*(maxR-minR);
            const theta3=theta1+(Math.random()-.5)*2.0, phi3=phi1+(Math.random()-.5)*2.0;
            const p3=new THREE.Vector3().setFromSphericalCoords(r3, phi3, theta3);
            const r2=(r1+r3)*0.5;
            const p2=new THREE.Vector3().setFromSphericalCoords(r2, (phi1+phi3)*.5, (theta1+theta3)*.5);
            return new THREE.CatmullRomCurve3([p1, p2, p3]);
        }
        for(let i=0; i<20; i++) {
            const mat = new THREE.MeshBasicMaterial({ color: currentTarget.primary, transparent: true, opacity: 0, blending: THREE.NormalBlending });
            activeMaterials.primary.push(mat);
            const mesh = new THREE.Mesh(new THREE.TubeGeometry(generatePath(), 8, 0.06, 4, false), mat);
            mesh.userData = { active: false, life: 0, targetLife: 0 };
            beamGroup.add(mesh); activeBeams.push(mesh);
        }
        function spawnBeam(beam) {
            beam.geometry.dispose(); beam.geometry = new THREE.TubeGeometry(generatePath(), 8, 0.06, 4, false);
            beam.userData.active = true; beam.userData.life = 0; beam.userData.targetLife = 40 + Math.random() * 30;
        }

        // --- 4. LOGIC & API ---
        window.setMode = function(modeName) {
            if (PALETTES[modeName]) {
                currentTarget = PALETTES[modeName];
                document.documentElement.style.setProperty('--primary-color', currentTarget.cssPrim);
                document.documentElement.style.setProperty('--secondary-color', currentTarget.cssSec);
            }
        };

        const transcriptEl = document.getElementById('transcript-text');
        const cursorEl = document.getElementById('cursor-el');
        window.setSkyeText = function(text) {
            transcriptEl.innerHTML = text; 
            if(text && text.length > 0) { cursorEl.classList.add('active'); } 
            else { cursorEl.classList.remove('active'); }
        }

        // --- 5. AUDIO SYSTEM (ROBUST VERSION) ---
        let audioContext, analyser, dataArray, isAudioActive = false;

        window.initAudio = async function() {
            try {
                // 1. Setup Context
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();

                // 2. Browser Resume Policy (CRITICAL FOR MAC/CHROME)
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                // 3. Request Mic
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 4. Connect
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                isAudioActive = true;
                
                // UI Update
                document.getElementById('start-btn').classList.add('hidden');
                document.getElementById('status-corner').innerHTML = "SYSTEM_ONLINE<br>LISTENING_MODE";
                setSkyeText("I'M LISTENING...");

            } catch (err) {
                console.error(err);
                // Fallback: If Mic Fails, alert user but keep UI running
                alert("ACCESS DENIED: Please allow Microphone access in your browser settings or OS Privacy settings to use voice features.");
            }
        };

        function getVolume() {
            if(!isAudioActive) return 0;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
            return (sum / dataArray.length) / 100.0;
        }

        // --- 6. ANIMATION LOOP ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate); 
            time += 0.008;

            const lerpFactor = 0.05; 
            activeMaterials.primary.forEach(mat => mat.color.lerp(currentTarget.primary, lerpFactor));
            activeMaterials.secondary.forEach(mat => mat.color.lerp(currentTarget.secondary, lerpFactor));
            activeMaterials.atmosphere.forEach(mat => mat.color.lerp(currentTarget.atmosphere, lerpFactor));
            scene.fog.color.lerp(new THREE.Color(currentTarget.fog), lerpFactor);

            // --- GET AUDIO DATA ---
            let vol = getVolume(); 
            
            // --- 1. ATMOSPHERE (BREATHING) ---
            const targetScale = 70 + (vol * 50); 
            const currentScale = glowSprite.scale.x;
            const newScale = currentScale + (targetScale - currentScale) * 0.1;
            glowSprite.scale.set(newScale, newScale, 1);
            glowSprite.material.opacity = 0.4 + (vol * 0.6); 

            // --- 2. SHELLS (EXPANSION & JITTER) ---
            shellGroup.rotation.x = Math.sin(time*0.5)*0.1; 
            shellGroup.rotation.z = Math.cos(time*0.3)*0.1;
            
            if(vol > 0.1) {
                shellGroup.rotation.x += (Math.random() - 0.5) * vol * 0.1;
                shellGroup.rotation.y += (Math.random() - 0.5) * vol * 0.1;
            }
            const shellScale = 1.0 + (vol * 0.1); 
            shellGroup.scale.setScalar(shellScale);


            // --- 3. BRAINS (PROCESSING SPEED) ---
            const brainSpeed = 0.005 + (vol * 0.05); 
            brain1.rotation.y += brainSpeed; 
            brain1.rotation.z -= 0.002; 
            brain2.rotation.x -= 0.003;
            brain1.scale.setScalar(1.0 + (vol * 0.2));
            brain2.scale.setScalar(1.0 + (vol * 0.15));


            // --- 4. CORE (ENERGY PULSE) ---
            layers.forEach((layer) => {
                const i = layer.userData.index;
                const waveSpeed = 1.0 + (vol * 10.0);
                const wave = Math.sin(time * waveSpeed - (i * 0.3)); 
                const intensity = (wave + 1) * 0.5; 
                const brightnessBoost = vol * 0.5;
                layer.material.opacity = layer.userData.baseOpacity + brightnessBoost + (intensity * (layer.userData.maxOpacity - layer.userData.baseOpacity));
                layer.scale.setScalar(1.0 + (vol * (i * 0.1)));
            });


            // --- 5. GIMBALS (ROTATION & WAVE) ---
            
            // >> CHANGED: Removed volume acceleration. Now uses constant speed. <<
            gimbalPivot.rotation.x = Math.cos(time * 0.1) * 1.0; 
            gimbalPivot.rotation.y += 0.004; // Constant slow rotation
            gimbalPivot.rotation.z += 0.002;
            
            gimbalPivot2.rotation.x = Math.sin(time * 0.1) * 1.5; 
            gimbalPivot2.rotation.y += 0.003; // Constant slow rotation
            gimbalPivot2.rotation.z += 0.002;

            // Audio Wave Logic
            const updateSegments = (segments, offsetTime) => {
                segments.forEach(seg => {
                    let targetR = seg.userData.radius;
                    if(vol > 0.01 || true) { 
                        const normIndex = seg.userData.index / (seg.userData.total - 1);
                        const middleMask = Math.pow(Math.sin(normIndex * Math.PI), 10);
                        const speed = time * (60 + (vol * 50)); 
                        const amplitude = (vol * 6.0); 
                        const wave = Math.sin(speed - seg.userData.index * 0.5 + offsetTime);
                        if(middleMask > 0.01) { targetR += (wave * middleMask * amplitude); }
                    }
                    seg.userData.currentRadius += (targetR - seg.userData.currentRadius) * 0.2;
                    const r = seg.userData.currentRadius;
                    seg.position.x = Math.cos(seg.userData.midAngle) * (r - seg.userData.radius); 
                    seg.position.y = Math.sin(seg.userData.midAngle) * (r - seg.userData.radius);
                });
            };
            updateSegments(gimbalSegments1, 0); 
            updateSegments(gimbalSegments2, 10);


            // --- 6. BEAMS (DATA FLOW) ---
            activeBeams.forEach(beam => {
                if(beam.userData.active) {
                    beam.userData.life++;
                    const progress = beam.userData.life / beam.userData.targetLife;
                    if(progress < 0.15) { beam.material.opacity = progress * 6; } else { beam.material.opacity = (1.0 - progress) * 0.8; }
                    if(progress >= 1) { beam.userData.active = false; beam.material.opacity = 0; }
                } else { 
                    const spawnChance = 0.97 - (vol * 0.1); 
                    if(Math.random() > spawnChance) spawnBeam(beam); 
                }
            });

            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        animate();
    </script>
</body>
</html>
