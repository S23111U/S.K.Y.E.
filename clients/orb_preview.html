<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SKYE Orb Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  /* Stand-in for whatever sits behind the orb. The canvas is composited with
     mix-blend-mode: screen, so its black is see-through and only the glow is
     added on top — the hologram reads as transparent, as in the references. */
  body {
    background:
      radial-gradient(ellipse at 28% 18%, rgba(40,70,120,0.30), transparent 55%),
      radial-gradient(ellipse at 80% 82%, rgba(20,30,60,0.45), transparent 60%),
      linear-gradient(160deg, #0a0f1a 0%, #06090f 100%);
    font-family: 'Share Tech Mono', monospace;
  }
  #stage { position: fixed; inset: 0; mix-blend-mode: screen; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5; display: flex; gap: 8px; }
  #controls button {
    background: rgba(255,150,30,0.06); border: 1px solid rgba(255,170,60,0.4); color: #ffb45a;
    font-family: inherit; font-size: 12px; letter-spacing: 2px; padding: 8px 14px; cursor: pointer;
  }
  #controls button.on { background: rgba(255,150,30,0.28); color: #fff3d6; }
  #hint { position: fixed; left: 24px; top: 20px; color: rgba(255,180,90,0.5); font-size: 11px; letter-spacing: 2px; z-index: 5; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint">ORB PREVIEW  -  SPEAKING replays the reference line; MIC reacts to your voice</div>
<div id="stage"></div>
<div id="controls">
  <button data-state="idle" class="on">IDLE</button>
  <button data-state="listening">LISTENING</button>
  <button data-state="thinking">THINKING</button>
  <button data-state="speaking">SPEAKING</button>
  <button id="mic">MIC</button>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// Loudness of the reference line ("Yes. If you will just allow me to contact
// Mr. Stark."), 30 samples a second, 0..1 — SPEAKING replays it so the orb
// moves to the same rhythm of words and pauses.
const LINE_ENV = [0.715, 0.79, 0.763, 0.777, 0.777, 0.744, 0.701, 0.617, 0.506, 0.44, 0.364, 0.27, 0.221, 0.195, 0.182, 0.178, 0.174, 0.168, 0.162, 0.158, 0.158, 0.16, 0.158, 0.153, 0.146, 0.145, 0.152, 0.152, 0.149, 0.339, 0.598, 0.762, 0.808, 0.796, 0.777, 0.757, 0.735, 0.677, 0.547, 0.425, 0.383, 0.337, 0.26, 0.192, 0.155, 0.136, 0.129, 0.15, 0.316, 0.501, 0.535, 0.423, 0.321, 0.297, 0.44, 0.638, 0.701, 0.742, 0.839, 0.824, 0.677, 0.521, 0.451, 0.466, 0.664, 0.893, 0.874, 0.673, 0.622, 0.643, 0.586, 0.643, 0.697, 0.611, 0.575, 0.731, 0.911, 0.992, 1.0, 0.997, 0.859, 0.763, 0.769, 0.732, 0.615, 0.541, 0.533, 0.435, 0.474, 0.63, 0.638, 0.715, 0.84, 0.783, 0.648, 0.554, 0.498, 0.576, 0.665, 0.598, 0.423, 0.324, 0.412, 0.556, 0.594, 0.546, 0.566, 0.61, 0.543, 0.423, 0.432, 0.516, 0.611, 0.725, 0.805, 0.781, 0.703, 0.754, 0.911, 1.0, 1.0, 0.952, 0.956, 1.0, 0.994, 0.97, 0.928, 0.83, 0.66, 0.516, 0.548, 0.623, 0.709, 0.797, 0.728];

// ── palette ──────────────────────────────────────────────────────────
// The hologram is a saturated orange; only the iris core and the densest
// data clusters go yellow-white. Keeping the mass orange is what stops it
// reading as a generic glowing ball.
const DEEP  = new THREE.Color(1.00, 0.28, 0.00);
const AMBER = new THREE.Color(1.00, 0.42, 0.02);
const GOLD  = new THREE.Color(1.00, 0.62, 0.08);
const HOT   = new THREE.Color(1.00, 0.82, 0.34);
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (...c) => c[Math.floor(Math.random() * c.length)];
const V3 = THREE.Vector3;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(0, 0, 4.2);
camera.lookAt(0, 0, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.5, 0.6, 0.25);
composer.addPass(bloom);

const orb = new THREE.Group();
scene.add(orb);
const R = 1.0;

// The whole thing is organised around one axis: a flat "equatorial" disc
// carrying the iris and the radial spokes, and a spherical shell of circuit
// detail whose meridians converge on that axis' poles. In the references the
// disc is seen nearly face-on, tilted a little.
const AXIS_TILT_X = -0.20, AXIS_TILT_Z = 0.10;
const disc = new THREE.Group(); disc.rotation.set(AXIS_TILT_X, 0, AXIS_TILT_Z); orb.add(disc);
const shell = new THREE.Group(); shell.rotation.set(AXIS_TILT_X, 0, AXIS_TILT_Z); orb.add(shell);

// ══════════════════════════════════════════════════════════════════════
// Ribbon shader. Every glowing line — circuit traces, spokes, iris rings,
// sparks — is a camera-facing quad a few pixels wide. Plain GL lines are
// locked to 1px and read as wire, never as light.
// ══════════════════════════════════════════════════════════════════════
class Segs {
  constructor() { this.p = []; this.c = []; this.ph = []; this.w = []; }
  add(a, b, col, ph, w = 1) {
    this.p.push(a.x, a.y, a.z, b.x, b.y, b.z);
    this.c.push(col.r, col.g, col.b); this.ph.push(ph); this.w.push(w);
  }
  get n() { return this.ph.length; }
}

const RIBBON_VERT = `
  attribute vec2 corner; attribute vec3 aA, aB, aColor; attribute float aPhase, aWidth;
  uniform float uTime, uLevel, uPulse, uExpand, uFlicker, uWidth, uBright, uDriftAmt;
  uniform float uSweep, uSweep2, uRipple;
  uniform vec3 uDrift; uniform vec2 uRes;
  varying vec3 vC; varying float vA, vSide;
  void main(){
    // The geometry is built with the orb's axis on +Z, so the distance from
    // that axis is the ring a fragment belongs to. Everything below keys off
    // it: the structure itself never moves, the light does.
    vec3 mid = (aA + aB) * 0.5;
    float rad = length(mid.xy);

    // Base brightness: steady, with only a slight per-fragment shimmer, so
    // the structure reads as solid rather than boiling.
    float f = sin(uTime * (0.7 + aPhase * 1.4) * uFlicker + aPhase * 50.0);
    float alpha = mix(0.30, 0.66, 0.5 + 0.5 * f);

    // Light passing outward through the layers: two soft bands travelling
    // from the core to the rim, brightening whichever rings they cross.
    float band  = exp(-pow((rad - uSweep)  / 0.11, 2.0));
    float band2 = exp(-pow((rad - uSweep2) / 0.075, 2.0));
    float lit = 1.15 * band + 0.55 * band2;
    alpha *= 1.0 + lit;

    // Speech is a ripple, not a heartbeat: a radial wave that the outer
    // rings ride further than the inner ones.
    float wave = 0.6 * sin(rad * 8.5 - uTime * 2.6) + 0.4 * sin(rad * 4.2 - uTime * 1.5);
    vec2 dirXY = rad > 1e-4 ? mid.xy / rad : vec2(0.0);
    vec3 ripple = vec3(dirXY * wave * uRipple * (0.25 + rad), 0.0);

    // Sparks stream along uDrift and fade in and out across their life.
    float k = fract(uTime * 0.11 * (0.5 + aPhase) + aPhase * 13.0);
    vec3 shift = uDrift * uDriftAmt * k;
    if (uDriftAmt > 0.0) alpha *= sin(3.14159 * k);

    vec3 a = aA + shift + ripple;
    vec3 b = aB + shift + ripple;

    vec4 ca = projectionMatrix * modelViewMatrix * vec4(a, 1.0);
    vec4 cb = projectionMatrix * modelViewMatrix * vec4(b, 1.0);
    vec2 sa = ca.xy / ca.w * uRes * 0.5, sb = cb.xy / cb.w * uRes * 0.5;
    vec2 dir = sb - sa; float len = length(dir);
    dir = len > 1e-4 ? dir / len : vec2(1.0, 0.0);
    vec2 nrm = vec2(-dir.y, dir.x);
    vec4 c = mix(ca, cb, corner.x);
    c.xy += nrm * corner.y * (uWidth * aWidth * 0.5) / (uRes * 0.5) * c.w;
    gl_Position = c;
    // the travelling light also pushes colour toward the hot end
    vC = aColor + vec3(0.0, 0.13, 0.17) * min(lit, 1.0);
    vSide = corner.y;
    vA = alpha * uBright;
  }`;
const RIBBON_FRAG = `
  varying vec3 vC; varying float vA, vSide;
  void main(){
    float edge = 1.0 - smoothstep(0.25, 1.0, abs(vSide));
    float a = vA * edge;
    // hotter down the centre line of each ribbon, orange at its edges
    vec3 col = vC + vec3(0.16, 0.09, 0.01) * pow(1.0 - abs(vSide), 2.5);
    gl_FragColor = vec4(col * a, a);
  }`;

const ribbonMats = [];
function ribbonMesh(segs, { width = 1.7, driftAmt = 0, bright = 1, flicker = 1, drift = null } = {}) {
  const n = segs.n, g = new THREE.InstancedBufferGeometry();
  g.setAttribute('corner', new THREE.Float32BufferAttribute([0, -1, 1, -1, 1, 1, 0, 1], 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  const A = new Float32Array(n * 3), B = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) {
    A[i * 3 + k] = segs.p[i * 6 + k]; B[i * 3 + k] = segs.p[i * 6 + 3 + k];
  }
  g.setAttribute('aA', new THREE.InstancedBufferAttribute(A, 3));
  g.setAttribute('aB', new THREE.InstancedBufferAttribute(B, 3));
  g.setAttribute('aColor', new THREE.InstancedBufferAttribute(new Float32Array(segs.c), 3));
  g.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array(segs.ph), 1));
  g.setAttribute('aWidth', new THREE.InstancedBufferAttribute(new Float32Array(segs.w), 1));
  g.instanceCount = n;
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0 }, uLevel: { value: 0 }, uPulse: { value: 0 }, uExpand: { value: 0 },
      uFlicker: { value: flicker }, uRes: { value: new THREE.Vector2(1, 1) }, uWidth: { value: width },
      uDriftAmt: { value: driftAmt }, uDrift: { value: drift || new THREE.Vector3(-0.35, 0.9, 0.1) },
      uBright: { value: bright }, uSweep: { value: -1 }, uSweep2: { value: -1 }, uRipple: { value: 0 },
    },
    vertexShader: RIBBON_VERT, fragmentShader: RIBBON_FRAG,
  });
  ribbonMats.push({ m, flicker0: flicker });
  const mesh = new THREE.Mesh(g, m); mesh.frustumCulled = false; return mesh;
}

// ══════════════════════════════════════════════════════════════════════
// 1. Concentric tracks.  The design is a sphere whose detail is organised
//    into circles of latitude about one axis; seen down that axis (how the
//    reference is framed) they read as ~30 concentric rings that bunch up
//    toward the rim.  Everything else — circuit detail, rungs, nodes —
//    hangs off those tracks, which is why the look is so ordered.
// ══════════════════════════════════════════════════════════════════════
// r is the projected radius (0 at the pole facing us, 1 at the silhouette);
// side +1 is the near hemisphere, -1 the far one.
const pt = (r, a, side = 1) =>
  new V3(Math.cos(a) * r, Math.sin(a) * r, side * Math.sqrt(Math.max(0, 1 - r * r)));

const trackSegs = new Segs();

// Gaps: each track is broken by a few angular slices, and the big outer rings
// carry one wide gap so the silhouette reads as a C rather than a closed ring.
function makeGaps(count, wide) {
  const g = [];
  for (let i = 0; i < count; i++) {
    const a = rnd(0, Math.PI * 2), w = wide && i === 0 ? rnd(0.5, 1.5) : rnd(0.08, 0.45);
    g.push([a, a + w]);
  }
  return g;
}
const inGap = (a, gaps) => gaps.some(([s0, e0]) => {
  const aa = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  return (aa > s0 && aa < e0) || (aa + Math.PI * 2 > s0 && aa + Math.PI * 2 < e0);
});

function track(r, side, opts) {
  const { col, width, dash, gaps, density } = opts;
  const N = Math.max(90, Math.round(density * r * 320));
  for (let i = 0; i < N; i++) {
    const a0 = i / N * Math.PI * 2, a1 = (i + dash) / N * Math.PI * 2;
    if (inGap(a0, gaps)) continue;
    if (Math.random() > opts.fill) continue;
    trackSegs.add(pt(r, a0, side), pt(r, a1, side), col, Math.random() * 0.4 + r * 0.3, width);
  }
}

// -- the tracks themselves
const RADII = [];
for (let i = 0; i < 34; i++) RADII.push(0.085 + Math.pow(i / 33, 1.08) * 0.925);
const trackInfo = [];
RADII.forEach((r, i) => {
  const outer = r > 0.86;
  const bold = Math.random() < 0.28 || outer;
  const col = bold ? pick(GOLD, HOT) : pick(AMBER, AMBER, DEEP);
  const info = {
    r, col,
    width: outer ? rnd(2.6, 3.8) : bold ? rnd(1.6, 2.6) : rnd(0.7, 1.3),
    dash: bold ? rnd(0.75, 0.95) : rnd(0.25, 0.7),
    fill: bold ? rnd(0.75, 0.95) : rnd(0.30, 0.7),
    gaps: makeGaps(outer ? 2 : 1 + Math.floor(Math.random() * 3), outer),
    density: rnd(0.8, 1.3),
  };
  trackInfo.push(info);
  track(r, 1, info);
  // the far hemisphere carries a sparser copy, which gives depth on rotation
  if (Math.random() < 0.7) track(r, -1, { ...info, fill: info.fill * 0.45, width: info.width * 0.7, col: DEEP, gaps: makeGaps(3) });
});

// -- circuit detail riding on the tracks: small blocks and ladder rungs
//    between neighbouring rings.  This is the fine texture in the reference.
for (let i = 1; i < RADII.length; i++) {
  const rIn = RADII[i - 1], rOut = RADII[i], gap = rOut - rIn;
  const info = trackInfo[i];
  // a band is either busy or nearly empty — that contrast is what makes it
  // read as data rather than as a uniform mesh
  const busy = Math.random() < 0.55;
  const blocks = busy ? 10 + Math.floor(Math.random() * 26) : Math.floor(Math.random() * 5);
  for (let b = 0; b < blocks; b++) {
    const a = rnd(0, Math.PI * 2);
    if (inGap(a, info.gaps)) continue;
    const aw = rnd(0.015, 0.09) / Math.max(0.25, rOut), side = 1;
    const r0 = rIn + gap * rnd(0.12, 0.35), r1 = rIn + gap * rnd(0.6, 0.92);
    const col = Math.random() < 0.25 ? HOT : pick(GOLD, AMBER, DEEP), ph = Math.random();
    const w = rnd(0.7, 1.3);
    const c00 = pt(r0, a - aw, side), c10 = pt(r0, a + aw, side);
    const c11 = pt(r1, a + aw, side), c01 = pt(r1, a - aw, side);
    trackSegs.add(c00, c10, col, ph, w); trackSegs.add(c10, c11, col, ph, w);
    trackSegs.add(c11, c01, col, ph, w); trackSegs.add(c01, c00, col, ph, w);
    if (Math.random() < 0.4) {                       // hatching inside the block
      for (let f = 1; f < 3; f++) {
        const rr = r0 + (r1 - r0) * f / 3;
        trackSegs.add(pt(rr, a - aw, side), pt(rr, a + aw, side), col, ph, 0.6);
      }
    }
  }
  // rungs: tiny radial ticks crossing the band
  const rungs = busy ? 30 + Math.floor(Math.random() * 60) : 8;
  for (let k = 0; k < rungs; k++) {
    const a = rnd(0, Math.PI * 2);
    if (inGap(a, info.gaps)) continue;
    trackSegs.add(pt(rIn + gap * rnd(0, 0.3), a, 1), pt(rIn + gap * rnd(0.6, 1.0), a, 1),
                  pick(AMBER, DEEP, GOLD), Math.random(), rnd(0.5, 1.0));
  }
}

// -- radial spokes: only a handful, and they wander like cracks rather than
//    ruling straight out.  Brightest near the iris, gone by the rim.
const SPOKES = 7;
for (let s2 = 0; s2 < SPOKES; s2++) {
  const a0 = s2 / SPOKES * Math.PI * 2 + rnd(-0.25, 0.25);
  const rEnd = rnd(0.62, 1.02), col = pick(GOLD, HOT, GOLD), ph = Math.random();
  const N = 40; let a = a0;
  for (let i = 0; i < N; i++) {
    const t0 = i / N, t1 = (i + 1) / N;
    const r0 = 0.27 + (rEnd - 0.27) * t0, r1 = 0.27 + (rEnd - 0.27) * t1;
    const a2 = a + rnd(-0.012, 0.012) + 0.02 * Math.sin(t0 * 6);
    if (Math.random() < 0.05) { a = a2; continue; }         // broken here and there
    trackSegs.add(pt(r0, a, 1), pt(r1, a2, 1), col, ph + t0 * 0.15, (1 - t0 * 0.65) * 3.2 + 0.4);
    a = a2;
  }
}

// -- the iris: tightly packed rings around a dark pupil, at the near pole.
//    The dark centre is what makes it read as an aperture.
const PUPIL = 0.072;
[[0.082, 2.6, HOT], [0.098, 1.6, GOLD], [0.112, 3.4, HOT], [0.129, 1.8, HOT],
 [0.145, 4.0, GOLD], [0.163, 1.7, HOT], [0.181, 3.0, GOLD], [0.201, 2.0, HOT],
 [0.221, 1.5, AMBER], [0.238, 2.6, GOLD]
].forEach(([r, w, col], i) => {
  const gaps = i % 3 === 0 ? makeGaps(1) : [];
  const N = 170;
  for (let k = 0; k < N; k++) {
    const a0 = k / N * Math.PI * 2, a1 = (k + 0.9) / N * Math.PI * 2;
    if (inGap(a0, gaps)) continue;
    trackSegs.add(pt(r, a0, 1), pt(r, a1, 1), col, Math.random() * 0.2, w);
  }
});
// a soft halo just outside the iris, which is what bleeds in the reference
for (let i = 0; i < 300; i++) {
  const a = rnd(0, Math.PI * 2), r0 = rnd(0.245, 0.27), r1 = r0 + rnd(0.006, 0.06);
  trackSegs.add(pt(r0, a, 1), pt(r1, a, 1), pick(HOT, GOLD), Math.random(), rnd(0.8, 2.4));
}

const trackMesh = ribbonMesh(trackSegs, { width: 1.5, bright: 1.0, flicker: 0.9 });
disc.add(trackMesh);

// -- bright junction nodes: a few points flare with a small starburst
const nodeSegs = new Segs();
const NODES = 7;
for (let i = 0; i < NODES; i++) {
  const r = rnd(0.30, 0.95), a = rnd(0, Math.PI * 2), c = pt(r, a, 1);
  const [nu, nv] = (() => {
    const n = c.clone().normalize();
    const t = Math.abs(n.z) < 0.9 ? new V3(0, 0, 1) : new V3(1, 0, 0);
    const u = t.clone().cross(n).normalize();
    return [u, n.clone().cross(u)];
  })();
  const ph = Math.random();
  for (let k = 0; k < 9; k++) {
    const ang = k / 9 * Math.PI * 2 + rnd(-0.1, 0.1), len = rnd(0.02, 0.09);
    const d = nu.clone().multiplyScalar(Math.cos(ang) * len).add(nv.clone().multiplyScalar(Math.sin(ang) * len));
    nodeSegs.add(c, c.clone().add(d), HOT, ph, rnd(1.0, 2.4));
  }
}
const nodeMesh = ribbonMesh(nodeSegs, { width: 1.6, bright: 1.1, flicker: 1.8 });
disc.add(nodeMesh);

// ══════════════════════════════════════════════════════════════════════
// 3. Sparks: fine dashes drifting through the volume and off the top edge,
//    the motion-blurred trails seen all over the reference frames.
// ══════════════════════════════════════════════════════════════════════
const sparkSegs = new Segs();
for (let i = 0; i < 900; i++) {
  const d = new V3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
  const a = d.multiplyScalar(R * (0.55 + Math.cbrt(Math.random()) * 0.55));
  const dir = new V3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize().multiplyScalar(rnd(0.015, 0.06));
  sparkSegs.add(a, a.clone().add(dir), pick(GOLD, HOT, AMBER, GOLD), Math.random(), rnd(0.6, 1.2));
}
const sparks = ribbonMesh(sparkSegs, { width: 1.2, driftAmt: 0.55, bright: 0.7, flicker: 2.6 });
orb.add(sparks);

// trailing streaks that peel off the rim, tapering as they go
const arcSegs = new Segs();
for (let i = 0; i < 22; i++) {
  const a0 = rnd(0, Math.PI * 2), spin = Math.random() < 0.5 ? 1 : -1;
  const sweep = spin * rnd(0.5, 1.4), reach = rnd(0.05, 0.30);
  const col = pick(GOLD, HOT), ph = Math.random(), N = 24;
  let prev = null;
  for (let k = 0; k <= N; k++) {
    const t = k / N;
    const a = a0 + sweep * t;
    const r = 0.97 + t * reach;
    const p = pt(Math.min(r, 1.0), a, 1).setLength(1 + Math.max(0, r - 1) + t * 0.08);
    if (prev) arcSegs.add(prev, p, col, ph + t * 0.3, (1 - t) * 2.2 + 0.2);
    prev = p;
  }
}
const arcs = ribbonMesh(arcSegs, { width: 1.4, bright: 0.8, flicker: 1.4 });
disc.add(arcs);

// ══════════════════════════════════════════════════════════════════════
// 4. Bokeh: defocused points of light. In the stills these soft dots are a
//    large part of why it reads as a photographed hologram, not a wireframe.
// ══════════════════════════════════════════════════════════════════════
function dotTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,225,170,1)'); g.addColorStop(0.28, 'rgba(255,170,60,0.85)');
  g.addColorStop(0.62, 'rgba(255,110,10,0.28)'); g.addColorStop(1, 'rgba(255,90,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const NB = 420;
const bPos = new Float32Array(NB * 3), bCol = new Float32Array(NB * 3), bSize = new Float32Array(NB), bPh = new Float32Array(NB);
for (let i = 0; i < NB; i++) {
  const d = new V3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize();
  // most sit on the shell, some float inside and read as out-of-focus
  const near = Math.random() < 0.72;
  const r = near ? R * rnd(0.93, 1.06) : R * rnd(0.2, 0.85);
  bPos[i * 3] = d.x * r; bPos[i * 3 + 1] = d.y * r; bPos[i * 3 + 2] = d.z * r;
  const c = near ? pick(GOLD, HOT, AMBER) : pick(AMBER, DEEP);
  bCol[i * 3] = c.r; bCol[i * 3 + 1] = c.g; bCol[i * 3 + 2] = c.b;
  bSize[i] = near ? rnd(0.010, 0.030) : rnd(0.030, 0.085);     // defocused ones are big and dim
  bPh[i] = Math.random();
}
const bokehGeo = new THREE.BufferGeometry();
bokehGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
bokehGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));
bokehGeo.setAttribute('size', new THREE.BufferAttribute(bSize, 1));
bokehGeo.setAttribute('ph', new THREE.BufferAttribute(bPh, 1));
const bokehMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
  uniforms: { uMap: { value: dotTexture() }, uScale: { value: 1 }, uTime: { value: 0 }, uLevel: { value: 0 } },
  vertexShader: `
    attribute float size, ph; attribute vec3 color;
    uniform float uScale, uTime, uLevel;
    varying vec3 vC; varying float vA;
    void main(){
      vC = color;
      float tw = 0.5 + 0.5 * sin(uTime * (0.8 + ph * 2.5) + ph * 40.0);
      vA = mix(0.18, 1.0, tw) * (0.7 + uLevel * 0.5);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uScale * (1.0 + uLevel * 0.35) / -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D uMap; varying vec3 vC; varying float vA;
    void main(){
      vec4 t = texture2D(uMap, gl_PointCoord);
      gl_FragColor = vec4(vC * t.rgb * t.a * vA, t.a * vA);
    }`,
});
const bokeh = new THREE.Points(bokehGeo, bokehMat);
bokeh.frustumCulled = false;
shell.add(bokeh);

// ══════════════════════════════════════════════════════════════════════
// Behaviour. One smoothed loudness level plus a per-word onset spike drive
// everything: the reference brightens and loosens on stressed words and
// settles in the gaps, so that is what the level does here.
// ══════════════════════════════════════════════════════════════════════
let state = new URLSearchParams(location.search).get('state') || 'idle';
let inputLevel = 0, level = 0, onset = 0, prevRaw = 0, simT = 0, sweepT = 0, micAnalyser = null, micData = null;
const LINE_SECONDS = LINE_ENV.length / 30, LOOP_GAP = 1.1;
function lineLevel(t) {
  const u = t % (LINE_SECONDS + LOOP_GAP);
  if (u >= LINE_SECONDS) return 0;
  const f = u * 30, i = Math.floor(f), a = LINE_ENV[i] ?? 0, b = LINE_ENV[i + 1] ?? a;
  return Math.max(0, ((a + (b - a) * (f - i)) - 0.16) / 0.84);
}
window.SkyeOrb = {
  setLevel: v => { inputLevel = Math.max(0, Math.min(1, v)); },
  setState: s => { state = s; document.querySelectorAll('#controls [data-state]').forEach(b => b.classList.toggle('on', b.dataset.state === s)); },
};
document.querySelectorAll('#controls [data-state]').forEach(b => b.onclick = () => window.SkyeOrb.setState(b.dataset.state));
window.SkyeOrb.setState(state);
document.getElementById('mic').onclick = async (e) => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    micAnalyser = ac.createAnalyser(); micAnalyser.fftSize = 256;
    ac.createMediaStreamSource(stream).connect(micAnalyser);
    micData = new Uint8Array(micAnalyser.frequencyBinCount); e.target.classList.add('on');
  } catch (err) { e.target.textContent = 'MIC BLOCKED'; }
};

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  simT += dt;

  let raw = inputLevel;
  if (micAnalyser) {
    micAnalyser.getByteFrequencyData(micData);
    let s = 0; for (const v of micData) s += v;
    raw = Math.max(raw, Math.min(1, (s / micData.length) / 70));
  }
  if (state === 'speaking' && !micAnalyser && inputLevel === 0) raw = lineLevel(simT);
  if (state === 'listening' && !micAnalyser && inputLevel === 0) raw = 0.13 + 0.09 * Math.sin(simT * 1.4);
  if (state === 'thinking') raw = 0.2 + 0.1 * Math.sin(simT * 5.0);
  level += (raw - level) * Math.min(1, dt * 14);
  if (raw < level) level += (raw - level) * Math.min(1, dt * 5);
  onset = Math.max(onset * Math.exp(-dt * 5), Math.min(1, Math.max(0, raw - prevRaw) * 7));
  prevRaw = raw;


  // The structure is fixed: it does not spin, drift or breathe. All the life
  // comes from light moving through it and from the rings rippling.
  //
  // One band of light per pass, travelling from the core out past the rim.
  // Speech speeds it up; it never jumps, so the sweep always reads as
  // continuous even when the level changes abruptly.
  sweepT += dt * (0.30 + level * 0.55 + (state === 'thinking' ? 0.5 : 0));
  const SWEEP_SPAN = 1.1;
  const u1 = 0.18 + (sweepT % 1) * SWEEP_SPAN;
  const u2 = 0.18 + ((sweepT + 0.55) % 1) * SWEEP_SPAN;

  // Ripple: a small idle swell, growing into a fluid wave while speaking.
  // The onset gets a gentle weight only, so words do not thump from the core.
  const ripple = 0.004 + level * 0.030 + onset * 0.012;

  ribbonMats.forEach(({ m, flicker0 }) => {
    const u = m.uniforms;
    u.uTime.value = t; u.uLevel.value = level; u.uPulse.value = onset;
    u.uSweep.value = u1; u.uSweep2.value = u2; u.uRipple.value = ripple;
    u.uFlicker.value = flicker0 * (state === 'thinking' ? 1.6 : 1);
    u.uRes.value.set(renderer.domElement.width, renderer.domElement.height);
  });
  bokehMat.uniforms.uTime.value = t;
  bokehMat.uniforms.uLevel.value = level;
  bokehMat.uniforms.uScale.value = renderer.domElement.height * 0.9;

  bloom.strength = 0.34 + level * 0.08 + (state === 'thinking' ? 0.06 : 0);
  composer.render();
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
