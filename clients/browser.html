<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S.K.Y.E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary-color: #1e88c8;
      --secondary-color: #4dbdf5;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body { margin: 0; overflow: hidden; background: #f6fbff; font-family: 'Orbitron', sans-serif; transition: background-color 1s ease; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }

    /* ── Top bar ── */
    #top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      background: linear-gradient(to bottom, rgba(246,251,255,0.7) 0%, transparent 100%);
      backdrop-filter: blur(4px);
    }
    #header-text { color: var(--primary-color); font-size: 18px; letter-spacing: 8px; font-weight: 400; transition: color 1s ease; }

    .status-dot { display: flex; align-items: center; gap: 7px; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--primary-color); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: background 0.4s; }
    .dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }

    /* ── Status corner ── */
    #status-corner {
      position: absolute; bottom: 200px; left: 28px; z-index: 20;
      font-family: 'Share Tech Mono', monospace; font-size: 10px;
      color: var(--primary-color); opacity: 0.6;
      border-left: 2px solid var(--primary-color); padding-left: 10px;
      transition: color 1s ease, border-color 1s ease;
    }

    /* ── Init button ── */
    #start-btn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; pointer-events: auto;
      background: transparent; border: 1px solid var(--primary-color);
      color: var(--primary-color); padding: 10px 24px;
      font-family: 'Share Tech Mono', monospace; font-size: 13px;
      cursor: pointer; letter-spacing: 2px; transition: all 0.3s ease;
    }
    #start-btn:hover { background: var(--primary-color); color: white; }
    #start-btn.hidden { display: none; }

    /* ── Transcript near orb ── */
    #transcript-area {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, 120px);
      z-index: 20; text-align: center; width: 400px; pointer-events: none;
    }
    #transcript-text {
      font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(to bottom, var(--secondary-color), var(--primary-color));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .cursor { display: none; width: 7px; height: 14px; background: var(--secondary-color); margin-left: 4px; animation: blink 1s infinite; vertical-align: middle; }
    .cursor.active { display: inline-block; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }


    /* ── Einstein detail panel ── */
    #detail-panel {
      position: absolute; top: 72px; bottom: 96px; right: 24px; width: min(480px, 92vw); z-index: 30;
      display: none; flex-direction: column;
      background: color-mix(in srgb, var(--primary-color) 6%, rgba(255,255,255,0.92));
      border: 1px solid color-mix(in srgb, var(--primary-color) 35%, transparent);
      backdrop-filter: blur(6px);
    }
    #detail-panel.show { display: flex; }
    #detail-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
      font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px; color: var(--primary-color);
      border-bottom: 1px solid color-mix(in srgb, var(--primary-color) 25%, transparent); }
    #detail-close { background: none; border: none; color: var(--primary-color); font-size: 18px; cursor: pointer; }
    #detail-body { overflow-y: auto; padding: 14px 16px; font-family: 'Inter', sans-serif; font-weight: 400;
      font-size: 14px; line-height: 1.65; color: #3a2e05; }
    #detail-body h3, #detail-body h4 { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 2px;
      color: var(--primary-color); margin: 14px 0 6px; }
    #detail-body ul { margin: 6px 0 6px 18px; }
    #detail-body p { margin: 6px 0; }
    #detail-note { padding: 8px 14px; font-family: 'Share Tech Mono', monospace; font-size: 11px; opacity: 0.6;
      color: var(--primary-color); border-top: 1px solid color-mix(in srgb, var(--primary-color) 20%, transparent); }

    /* ── QA Display ── */
    #qa-display {
      position: absolute; bottom: 80px; left: 0; right: 0; z-index: 20;
      padding: 0 40px;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
    }
    .qa-question {
      font-family: 'Share Tech Mono', monospace; font-size: 13px;
      color: color-mix(in srgb, var(--primary-color) 55%, transparent); letter-spacing: 2px; text-transform: uppercase;
      animation: fade-up 0.2s ease;
    }
    .qa-question::before { content: '> '; opacity: 0.5; }
    .qa-answer {
      font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 1.7;
      color: var(--primary-color); letter-spacing: 1px;
      animation: fade-up 0.25s ease;
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .typing-dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--primary-color); margin: 0 2px; animation: blink 1.2s ease-in-out infinite; vertical-align: middle; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Input bar ── */
    #input-bar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      display: flex; gap: 8px; padding: 14px 40px 20px; align-items: flex-end;
      background: linear-gradient(to top, rgba(246,251,255,0.6) 0%, transparent 100%);
    }
    #msg-input {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid color-mix(in srgb, var(--primary-color) 35%, transparent);
      border-radius: 0; padding: 8px 0; color: #0b2a3d;
      font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: 2px;
      resize: none; max-height: 60px; outline: none; transition: border-color 0.2s;
      text-transform: uppercase;
    }
    #msg-input:focus { border-bottom-color: var(--primary-color); }
    #msg-input::placeholder { color: color-mix(in srgb, var(--primary-color) 30%, transparent); }
    #send-btn {
      width: 32px; height: 32px; border-radius: 0; border: 1px solid color-mix(in srgb, var(--primary-color) 40%, transparent);
      background: transparent; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    #send-btn:hover { background: var(--primary-color); }
    #send-btn:hover svg { fill: white; }
    #send-btn:active { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #send-btn svg { width: 14px; height: 14px; fill: var(--primary-color); transition: fill 0.2s; }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="top-bar">
  <div id="header-text">S.K.Y.E.</div>
  <div class="status-dot">
    <div class="dot" id="dot"></div>
    <span id="status-text" style="font-family:'Share Tech Mono',monospace;font-size:11px;">OFFLINE</span>
  </div>
</div>

<!-- Init button -->
<button id="start-btn" onclick="initAudio()">INITIALIZE SYSTEMS</button>

<!-- Transcript near orb -->
<div id="transcript-area">
  <span id="transcript-text"></span><span class="cursor" id="cursor-el"></span>
</div>

<!-- QA Display -->
<div id="detail-panel"><div id="detail-head"><span>EINSTEIN MODE</span><button id="detail-close" title="Close">×</button></div><div id="detail-body"></div><div id="detail-note"></div></div>
<div id="qa-display">
  <div class="qa-question" id="qa-q" style="display:none"></div>
  <div class="qa-answer"  id="qa-a" style="display:none"></div>
</div>

<!-- Input bar -->
<div id="input-bar">
  <textarea id="msg-input" rows="1" placeholder="QUERY S.K.Y.E..."></textarea>
  <button id="send-btn" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script type="module">
  import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

  // ── PALETTES ──
  const PALETTES = {
    default:   { primary: new THREE.Color(0x1e88c8), secondary: new THREE.Color(0x6fcbff), atmosphere: new THREE.Color(0x8fd8ff), cssPrim: '#1e88c8', cssSec: '#4dbdf5', fog: 0xeaf6ff },
    health:    { primary: new THREE.Color(0xcc0000), secondary: new THREE.Color(0xff4444), atmosphere: new THREE.Color(0xff0000), cssPrim: '#cc0000', cssSec: '#ff4444', fog: 0xffdddd },
    knowledge: { primary: new THREE.Color(0xd9640a), secondary: new THREE.Color(0xffa04d), atmosphere: new THREE.Color(0xffc48a), cssPrim: '#d9640a', cssSec: '#ff9a45', fog: 0xfff3e6 },
    calendar:  { primary: new THREE.Color(0x7b3fc4), secondary: new THREE.Color(0xb98cf0), atmosphere: new THREE.Color(0xd2b3ff), cssPrim: '#7b3fc4', cssSec: '#a878e8', fog: 0xf4ecff },
    einstein:  { primary: new THREE.Color(0xc99a06), secondary: new THREE.Color(0xffd54a), atmosphere: new THREE.Color(0xffe58a), cssPrim: '#b8860b', cssSec: '#f2b705', fog: 0xfff8df },
    finance:   { primary: new THREE.Color(0x0a8a4a), secondary: new THREE.Color(0x2ee6a0), atmosphere: new THREE.Color(0x66ffaa), cssPrim: '#0a8a4a', cssSec: '#2ee6a0', fog: 0xeafff2 }
  };
  let currentTarget = PALETTES.default;
  const activeMaterials = { primary: [], secondary: [], atmosphere: [] };

  // ── THREE SETUP ──
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xeaf6ff, 0.02);
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 35;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  const galaxy = new THREE.Group(); scene.add(galaxy);
  const atmosphereGroup = new THREE.Group(); scene.add(atmosphereGroup);

  function getGlowSpriteTex() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d'), g = ctx.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(255,255,255,0.85)'); g.addColorStop(0.35,'rgba(255,255,255,0.35)'); g.addColorStop(0.7,'rgba(255,255,255,0.08)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
  }
  const glowMat = new THREE.SpriteMaterial({ map: getGlowSpriteTex(), color: currentTarget.atmosphere, transparent: true, blending: THREE.NormalBlending });
  activeMaterials.atmosphere.push(glowMat);
  const glowSprite = new THREE.Sprite(glowMat); glowSprite.scale.set(70,70,1); glowSprite.position.z = -10; glowSprite.visible = false; // the soft halo rendered as banded specks

  function getCircuitTex() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d'); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
    for(let i=0;i<25;i++){const x=Math.random()*256,y=Math.random()*256;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(Math.random()*60-30),y+(Math.random()*60-30));ctx.stroke();}
    return new THREE.CanvasTexture(c);
  }
  const circuitTex = getCircuitTex();
  const shellGroup = new THREE.Group(); galaxy.add(shellGroup);
  function createPlate(r,ps,pl,ts,tl){
    const geo=new THREE.SphereGeometry(r,32,32,ps,pl,ts,tl);
    const mat=new THREE.MeshBasicMaterial({transparent:true,opacity:0.12,side:THREE.DoubleSide,blending:THREE.NormalBlending,depthWrite:false,color:currentTarget.secondary});
    activeMaterials.secondary.push(mat);
    const m=new THREE.Mesh(geo,mat);
    const wm=new THREE.LineBasicMaterial({color:currentTarget.primary,transparent:true,opacity:0.3});
    activeMaterials.primary.push(wm);
    m.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo),wm)); return m;
  }
  shellGroup.add(createPlate(12,0,2,0,1.5)); shellGroup.add(createPlate(12.2,2.5,1.5,1,2));
  shellGroup.add(createPlate(11.8,4.5,1.5,0.5,2.5)); shellGroup.add(createPlate(12.5,1,1,2,1));

  function makeBrain(r,d,type,op){
    const mat=new THREE.MeshBasicMaterial({color:type==='primary'?currentTarget.primary:currentTarget.secondary,wireframe:true,transparent:true,opacity:op,blending:THREE.NormalBlending,side:THREE.DoubleSide});
    if(type==='primary')activeMaterials.primary.push(mat);else activeMaterials.secondary.push(mat);
    return new THREE.Mesh(new THREE.IcosahedronGeometry(r,d),mat);
  }
  const brain1=makeBrain(7,1,'primary',0.5); galaxy.add(brain1);
  const brain2=makeBrain(8,0,'secondary',0.4); galaxy.add(brain2);

  const coreGroup=new THREE.Group(); galaxy.add(coreGroup); const layers=[];
  for(let i=0;i<10;i++){
    const mat=new THREE.MeshBasicMaterial({color:currentTarget.secondary,transparent:true,opacity:0.1,side:THREE.FrontSide,depthWrite:false,blending:THREE.NormalBlending});
    activeMaterials.secondary.push(mat);
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.2+(2.0*(i/9)),32,32),mat);
    m.userData={baseOpacity:0.15,maxOpacity:0.5-(i*0.03),index:i}; coreGroup.add(m); layers.push(m);
  }

  const gimbalPivot=new THREE.Group(); galaxy.add(gimbalPivot);
  const gimbalPivot2=new THREE.Group(); galaxy.add(gimbalPivot2);
  const gimbalSegments1=[]; const gimbalSegments2=[];
  function createArc(group,arr,r,angle,count,rot){
    const seg=angle/count;
    for(let i=0;i<count;i++){
      const geo=new THREE.TorusGeometry(r,0.4,4,6,seg);
      const mat=new THREE.MeshBasicMaterial({color:currentTarget.primary,transparent:true,opacity:0.1});
      activeMaterials.primary.push(mat);
      const wm=new THREE.LineBasicMaterial({color:currentTarget.secondary,opacity:1,transparent:true});
      activeMaterials.secondary.push(wm);
      const m=new THREE.Mesh(geo,mat); m.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo),wm));
      m.rotation.z=i*seg; m.userData={index:i,total:count,radius:r,currentRadius:r,midAngle:i*seg+(seg/2)};
      group.add(m); arr.push(m);
    }
    group.rotation.z=rot;
  }
  createArc(gimbalPivot,gimbalSegments1,15,Math.PI,100,Math.PI/2);
  createArc(gimbalPivot2,gimbalSegments2,15,Math.PI,100,-Math.PI/2);

  const beamGroup=new THREE.Group(); galaxy.add(beamGroup); const activeBeams=[];
  function genPath(){
    const r1=2,mn=4,mx=12,t1=Math.random()*Math.PI*2,p1e=Math.acos(2*Math.random()-1);
    const v1=new THREE.Vector3().setFromSphericalCoords(r1,p1e,t1);
    const r3=mn+Math.random()*(mx-mn),t3=t1+(Math.random()-.5)*2,p3e=p1e+(Math.random()-.5)*2;
    const v3=new THREE.Vector3().setFromSphericalCoords(r3,p3e,t3);
    const v2=new THREE.Vector3().setFromSphericalCoords((r1+r3)*.5,(p1e+p3e)*.5,(t1+t3)*.5);
    return new THREE.CatmullRomCurve3([v1,v2,v3]);
  }
  for(let i=0;i<20;i++){
    const mat=new THREE.MeshBasicMaterial({color:currentTarget.primary,transparent:true,opacity:0,blending:THREE.NormalBlending});
    activeMaterials.primary.push(mat);
    const m=new THREE.Mesh(new THREE.TubeGeometry(genPath(),8,0.06,4,false),mat);
    m.userData={active:false,life:0,targetLife:0}; beamGroup.add(m); activeBeams.push(m);
  }
  function spawnBeam(b){b.geometry.dispose();b.geometry=new THREE.TubeGeometry(genPath(),8,0.06,4,false);b.userData={active:true,life:0,targetLife:40+Math.random()*30};}

  // ── PALETTE SWITCH ──
  window.setMode = function(mode){
    if(!PALETTES[mode])return;
    currentTarget=PALETTES[mode];
    document.documentElement.style.setProperty('--primary-color',currentTarget.cssPrim);
    document.documentElement.style.setProperty('--secondary-color',currentTarget.cssSec);
  };

  // ── TRANSCRIPT ──
  const transcriptEl=document.getElementById('transcript-text');
  const cursorEl=document.getElementById('cursor-el');
  window.setSkyeText=function(text){
    transcriptEl.textContent=text;
    cursorEl.classList.toggle('active',!!(text&&text.length));
  };

  // ── AUDIO ──
  let audioContext,analyser,dataArray,isAudioActive=false;
  window.initAudio=async function(){
    try{
      // Web Audio playback (SKYE's replies) also needs a real user gesture to
      // be unlocked in Safari, so create/resume the shared AudioContext here.
      const AC=window.AudioContext||window.webkitAudioContext; audioContext=new AC();
      // The voice I/O code (capture/playback) lives in a separate, non-module
      // <script> tag below, which cannot see this module script's top-level
      // `let` bindings — expose the ones it needs on `window` explicitly.
      window.audioContext=audioContext;
      if(audioContext.state==='suspended')await audioContext.resume();
      const stream=await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:true, noiseSuppression:true, autoGainControl:true
      }});
      window.micStream=stream;
      analyser=audioContext.createAnalyser(); analyser.fftSize=256;
      audioContext.createMediaStreamSource(stream).connect(analyser);
      dataArray=new Uint8Array(analyser.frequencyBinCount);
      isAudioActive=true;
      document.getElementById('start-btn')?.classList.add('hidden');
      const sc=document.getElementById('status-corner');
      if(sc)sc.innerHTML='SYSTEM_ONLINE<br>LISTENING_MODE';
      setSkyeText("I'M LISTENING...");
      if(window.startVoice)window.startVoice();
    }catch(e){
      // Report what actually failed. This used to say "access denied" for every
      // error, including missing devices and insecure contexts.
      console.error('initAudio failed:', e);
      const why = {
        NotAllowedError:'Permission was refused. Check the browser site permission AND macOS System Settings > Privacy & Security > Microphone.',
        NotFoundError:'No microphone was found on this machine.',
        NotReadableError:'The microphone is in use by another app.',
        SecurityError:'Blocked: the page is not in a secure context (use http://localhost, not a LAN IP).'
      }[e.name] || e.message;
      alert('Microphone unavailable ('+e.name+').\n\n'+why+
            '\n\nYou can still type queries below; voice input/output requires mic access.');
      document.getElementById('start-btn').textContent='AUDIO UNAVAILABLE';
    }
  };
  function getVolume(){
    if(!isAudioActive)return 0;
    analyser.getByteFrequencyData(dataArray);
    let s=0; for(let i=0;i<dataArray.length;i++)s+=dataArray[i];
    return(s/dataArray.length)/100;
  }

  // ── ANIMATION ──
  let time=0;
  function animate(){
    requestAnimationFrame(animate); time+=0.008;
    const lf=0.05;
    activeMaterials.primary.forEach(m=>m.color.lerp(currentTarget.primary,lf));
    activeMaterials.secondary.forEach(m=>m.color.lerp(currentTarget.secondary,lf));
    activeMaterials.atmosphere.forEach(m=>m.color.lerp(currentTarget.atmosphere,lf));
    scene.fog.color.lerp(new THREE.Color(currentTarget.fog),lf);
    const vol=getVolume();
    const ts=70+(vol*50),cs=glowSprite.scale.x; glowSprite.scale.set(cs+(ts-cs)*.1,cs+(ts-cs)*.1,1); glowMat.opacity=0.4+(vol*0.6);
    shellGroup.rotation.x=Math.sin(time*.5)*.1; shellGroup.rotation.z=Math.cos(time*.3)*.1;
    if(vol>.1){shellGroup.rotation.x+=(Math.random()-.5)*vol*.1;shellGroup.rotation.y+=(Math.random()-.5)*vol*.1;}
    shellGroup.scale.setScalar(1+(vol*.1));
    const bs=0.005+(vol*.05); brain1.rotation.y+=bs; brain1.rotation.z-=0.002; brain2.rotation.x-=0.003;
    brain1.scale.setScalar(1+(vol*.2)); brain2.scale.setScalar(1+(vol*.15));
    layers.forEach(l=>{const ws=1+(vol*10),w=Math.sin(time*ws-(l.userData.index*.3)),inten=(w+1)*.5;l.material.opacity=l.userData.baseOpacity+(vol*.5)+(inten*(l.userData.maxOpacity-l.userData.baseOpacity));l.scale.setScalar(1+(vol*(l.userData.index*.1)));});
    gimbalPivot.rotation.x=Math.cos(time*.1)*1; gimbalPivot.rotation.y+=0.004; gimbalPivot.rotation.z+=0.002;
    gimbalPivot2.rotation.x=Math.sin(time*.1)*1.5; gimbalPivot2.rotation.y+=0.003; gimbalPivot2.rotation.z+=0.002;
    const updateSegs=(segs,off)=>segs.forEach(s=>{let tr=s.userData.radius;const ni=s.userData.index/(s.userData.total-1),mm=Math.pow(Math.sin(ni*Math.PI),10),sp=time*(60+(vol*50)),amp=vol*6,wv=Math.sin(sp-s.userData.index*.5+off);if(mm>.01)tr+=wv*mm*amp;s.userData.currentRadius+=(tr-s.userData.currentRadius)*.2;const r=s.userData.currentRadius;s.position.x=Math.cos(s.userData.midAngle)*(r-s.userData.radius);s.position.y=Math.sin(s.userData.midAngle)*(r-s.userData.radius);});
    updateSegs(gimbalSegments1,0); updateSegs(gimbalSegments2,10);
    activeBeams.forEach(b=>{if(b.userData.active){b.userData.life++;const p=b.userData.life/b.userData.targetLife;b.material.opacity=p<.15?p*6:(1-p)*.8;if(p>=1){b.userData.active=false;b.material.opacity=0;}}else if(Math.random()>.97-vol*.1)spawnBeam(b);});
    renderer.render(scene,camera);
  }
  window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
  animate();
</script>

<script>
  // ── WEBSOCKET Q&A ──
  const WS_URL='ws://localhost:8765';
  const qaQ=document.getElementById('qa-q');
  const qaA=document.getElementById('qa-a');
  const input=document.getElementById('msg-input');
  const sendBtn=document.getElementById('send-btn');
  const dot=document.getElementById('dot');
  const statusT=document.getElementById('status-text');
  let ws,waiting=false;
  // turnActive: the server still owes us a turn_end (it is generating or
  // speaking). dropAudio: we interrupted that turn, so any audio_chunk still
  // in flight for it must be discarded until its turn_end arrives — without
  // this the remaining sentences of an interrupted reply played anyway.
  let turnActive=false, dropAudio=false;
  let skillMode=false, revertWhenIdle=false, modeLock=null;   // modeLock: Einstein mode stays on until switched off
  function revertSkillMode(){
    revertWhenIdle=false;
    if(skillMode){ skillMode=false; if(window.setMode)window.setMode(modeLock||'default'); }
  }
  // Speech that arrives while SKYE is still generating a reply: kept and sent
  // once that reply's text is done, instead of being discarded.
  let busyQueue='';

  input.addEventListener('input',()=>{
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,60)+'px';
  });

  function connect(){
    ws=new WebSocket(WS_URL);
    ws.onopen=()=>{dot.classList.add('online');statusT.textContent='ONLINE';};
    ws.onclose=()=>{dot.classList.remove('online');statusT.textContent='OFFLINE';setTimeout(connect,3000);};
    ws.onerror=()=>ws.close();
    let streamed='';
    let suppressProactiveAudio=false;
    ws.onmessage=(e)=>{
      let msg;
      try{msg=JSON.parse(e.data);}catch(err){return;}

      if(msg.type==='start'){
        streamed='';
        qaA.style.display='block';
        qaA.className='qa-answer';
        qaA.textContent='';
        // No resetPlayback() here: the filler phrase is sent just before this
        // frame, and clearing playback on 'start' cut it off after ~100 ms
        // (found by driving the page in headless Chromium). Audio from a
        // previous reply is cleared in send() instead.
        if(window.setSkyeText)window.setSkyeText('RESPONDING');
      }
      else if(msg.type==='token'){
        streamed+=msg.text;
        qaA.textContent=streamed;
      }
      else if(msg.type==='tool'){
        qaA.textContent='['+msg.name+']';
        if(window.setSkyeText)window.setSkyeText('EXECUTING');
      }
      else if(msg.type==='done'){
        qaA.textContent=msg.text;
        void qaA.offsetWidth;
        qaA.className='qa-answer';
        waiting=false;
        sendBtn.disabled=false;
        if(window.setSkyeText)window.setSkyeText('');
        if(busyQueue){ const t=busyQueue; busyQueue=''; input.value=t; send(); }
      }
      else if(msg.type==='detail'){
        showDetail(msg.text,msg.note);
      }
      else if(msg.type==='skill'){
        // A specialised skill is answering: recolour for it, switch back to
        // default once SKYE has finished speaking (see revertSkillMode).
        if(msg.lock===true)modeLock=msg.ui;
        else if(msg.lock===false)modeLock=null;
        const ui=(msg.ui==='default'&&modeLock)?modeLock:(msg.ui||'default');
        if(window.setMode)window.setMode(ui);
        skillMode=ui!=='default'&&ui!==modeLock;
        revertWhenIdle=false;
      }
      else if(msg.type==='mood'){
        if(window.setSkyeText)window.setSkyeText('SPEAKING - '+String(msg.mood||'calm').toUpperCase());
      }
      else if(msg.type==='audio_chunk'){
        if(suppressProactiveAudio||dropAudio)return;
        playAudioChunk(msg.pcm, msg.sample_rate||24000, !!msg.final);
      }
      else if(msg.type==='turn_end'){
        // done already updated the text/UI state; nothing else needed here.
        suppressProactiveAudio=false;
        turnActive=false;
        dropAudio=false;
        revertWhenIdle=true;
        if(!speaking)revertSkillMode();
      }
      else if(msg.type==='proactive'){
        // SKYE speaking first — a due task/reminder, not a reply to
        // anything just sent. While asleep, the user explicitly asked for
        // quiet, so voice is skipped here (the server's plyer notification,
        // fired alongside this frame, is the fallback that still reaches
        // them) rather than teaching the server about client sleep state.
        if(asleep){ suppressProactiveAudio=true; return; }
        turnActive=true;
        qaQ.style.display='none';
        qaA.style.display='block';
        qaA.className='qa-answer';
        qaA.textContent=msg.text;
      }
      else if(msg.type==='transcript'){
        handleTranscript(msg.text||'');
      }
      else if(msg.type==='error'){
        qaA.textContent='[error] '+msg.message;
        waiting=false;
        sendBtn.disabled=false;
      }
    };
  }
  connect();

  function showTyping(){
    qaA.style.display='block';
    qaA.innerHTML='<span class="typing-dots"><span></span><span></span><span></span></span>';
  }

  // ── Einstein detail panel: the long answer SKYE does not read aloud ──
  const detailPanel=document.getElementById('detail-panel'), detailBody=document.getElementById('detail-body'), detailNote=document.getElementById('detail-note');
  document.getElementById('detail-close').onclick=()=>detailPanel.classList.remove('show');
  function mdLite(t){
    const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const inline=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
    let out='',list=false;
    for(const raw of esc.split('\n')){
      const line=raw.trim(); let m;
      if((m=line.match(/^[-*•]\s+(.*)/))||(m=line.match(/^\d+[.)]\s+(.*)/))){ if(!list){out+='<ul>';list=true;} out+='<li>'+inline(m[1])+'</li>'; continue; }
      if(list){out+='</ul>';list=false;}
      if((m=line.match(/^#{1,4}\s+(.*)/))) out+='<h3>'+inline(m[1])+'</h3>';
      else if(line) out+='<p>'+inline(line)+'</p>';
    }
    return out+(list?'</ul>':'');
  }
  function showDetail(text,note){
    detailBody.innerHTML=mdLite(text||''); detailBody.scrollTop=0;
    detailNote.textContent=note||''; detailPanel.classList.add('show');
  }

  function send(){
    const text=input.value.trim();
    if(!text||waiting||ws.readyState!==WebSocket.OPEN)return;

    detailPanel.classList.remove('show');
    // Show question
    qaQ.style.display='block';
    void qaQ.offsetWidth; // re-trigger animation
    qaQ.className='qa-question';
    qaQ.textContent=text;

    // Clear answer while waiting
    qaA.textContent='';
    showTyping();

    if(window.setSkyeText)window.setSkyeText('PROCESSING...');
    // Trailing newline: the server's FrameReader (core/protocol.py) is
    // NDJSON — it buffers until it sees "\n", so a message without one would
    // just sit unparsed forever.
    ws.send(JSON.stringify({type:'text', text})+'\n');
    stopSpeaking();   // anything still playing belongs to the previous reply
    turnActive=true; dropAudio=false;
    input.value='';
    input.style.height='auto';
    waiting=true;
    sendBtn.disabled=true;
  }

  // ── VOICE: speech in, speech out ───────────────────────────────────────
  // Both directions are now fully local: STT (mlx-whisper) and TTS (XTTS-v2)
  // run server-side on-device, so raw audio never leaves this machine. The
  // browser's job is just capture (VAD + PCM) and playback (a Web Audio
  // queue fed by "audio_chunk" frames) — no SpeechRecognition, no
  // speechSynthesis.
  //
  // The wake word is OPTIONAL: anything you say becomes a query, and saying
  // "Skye" first simply strips it. Background speech is therefore also sent,
  // so "stop listening" exists as a spoken off switch. This logic used to run
  // on live SpeechRecognition partials; it's unchanged, just triggered once
  // per captured utterance on the transcript the server echoes back (see the
  // "transcript" case in ws.onmessage) instead of continuously.
  const WAKE=/^\s*(?:hey\s+|ok(?:ay)?\s+)?(?:skye|sky|ski)\b[\s,.!?-]*/i;
  const CANCEL=/^\s*(?:scratch that|never ?mind|forget it|ignore that|cancel(?: that)?)\s*[.!?]*\s*$/i;
  // Matches the end of an utterance, so "Oh okay, thank you Sky. You can sleep
  // now." works as well as a bare "go to sleep". Anchored at the end and at a
  // clause start, so "how much sleep do I need" or "I can't sleep" do not.
  const STOP=/(?:^|[.,!?]\s*)(?:(?:i think|i guess|i suppose|okay|ok|so|well|alright|right|and)[\s,]+)*(?:(?:skye|sky)[\s,]*)?(?:(?:you can|you could|please|now|go|just|can)\s+)*(?:stop listening|stop the mic|go to sleep|put yourself to sleep|mute yourself|sleep|stand ?by|good ?night)(?:\s+(?:now|for now|please))?(?:[\s,]*(?:skye|sky))?\s*[.!?]*\s*$/i;
  const FILLER=/^(?:um+|uh+|hm+|mm+|ah+|oh+|er+|eh+|yeah|yep|ok|okay|hello|hi)$/i;
  // While asleep the microphone stays live (audio still reaches local
  // Whisper); the only difference is that nothing but the wake word is acted on.
  const WAKE_ONLY=/^(?:wake up|wake|you there|are you there|hello|hey)$/i;

  let recogWanted=false,speaking=false,asleep=false;

  function vstatus(t){ if(window.setSkyeText)window.setSkyeText(t); }

  // ---- false-start trimming ----
  // "dynamic vector dynamic array is vector" -> "dynamic array is vector".
  // Only the opening few words are searched, so a genuine later repeat
  // ("the sky is blue and the sky is grey") is left intact.
  function trimFalseStart(text){
    const w=text.split(/\s+/);
    if(w.length<4)return text;
    const norm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');
    const first=norm(w[0]);
    if(!first)return text;
    let cut=0;
    for(let i=2;i<Math.min(w.length,5);i++){ if(norm(w[i])===first)cut=i; }
    return cut?w.slice(cut).join(' '):text;
  }

  // Runs once per VAD-captured utterance, on the transcript the server sends
  // back for an "audio" frame. Same wake/stop/cancel/filler decisions the old
  // per-recognition-event commitSpeech() made, just triggered once per
  // utterance instead of continuously.
  // ---- endpointing grace: don't commit a half-finished thought ----
  // The VAD ends an utterance after VAD_SILENCE_MS of quiet, but people pause
  // mid-sentence to think. Committing at that point sent the first half alone
  // and (because SKYE was then busy) threw the second half away. So a finished
  // utterance is held for a moment and merged with whatever comes next; the
  // hold is longer when it ends on a word that clearly wants a continuation.
  const HOLD_COMPLETE_MS=900, HOLD_DANGLING_MS=2500;
  const DANGLING=/(?:\b(?:and|but|because|which|or|if|when|then|the|a|an|of|to|also|um+|uh+|er+|hm+)|[,;:\-]|\.{2,}|\u2026)\s*\.?\s*$/i;
  let pendingText='', holdTimer=null;

  function armHold(){
    clearTimeout(holdTimer);
    holdTimer=setTimeout(commitPending, DANGLING.test(pendingText)?HOLD_DANGLING_MS:HOLD_COMPLETE_MS);
  }
  // Re-arm after a stretch of input that turned out to be noise / too short.
  function resumeHold(){ if(pendingText&&!holdTimer)armHold(); }
  function clearPending(){ clearTimeout(holdTimer); holdTimer=null; pendingText=''; }
  function commitPending(){
    holdTimer=null;
    const t=pendingText; pendingText='';
    if(!t)return;
    if(waiting){ busyQueue=busyQueue?busyQueue+' '+t:t; vstatus('QUEUED'); return; }
    input.value=t; send();
  }

  // Runs once per VAD-captured utterance, on the transcript the server sends
  // back for an "audio" frame. Same wake/stop/cancel/filler decisions the old
  // per-recognition-event commitSpeech() made, just triggered once per
  // utterance instead of continuously.
  function handleTranscript(rawText){
    let text=(rawText||'').trim();
    if(!text){ resumeHold(); return; }

    if(asleep){
      const m=text.match(WAKE);
      if(!m)return;
      asleep=false;
      vstatus('LISTENING');
      const rest=text.slice(m[0].length).trim();
      if(rest&&!WAKE_ONLY.test(rest)&&rest.replace(/[^a-z0-9]/gi,'').length>=3&&!waiting){
        input.value=trimFalseStart(rest); send();
      }
      return;
    }

    if(STOP.test(text)){
      asleep=true;
      clearPending(); busyQueue='';
      interruptSpeech();
      // Ambient noise during sleep (mic stays live by design) must not glue
      // onto whatever utterance wakes SKYE back up.
      resetVadState();
      vstatus('SLEEPING - SAY "SKYE"');
      return;
    }
    if(CANCEL.test(text)){ clearPending(); busyQueue=''; interruptSpeech(); vstatus('CANCELLED'); return; }

    text=text.replace(WAKE,'').trim();                   // wake word optional
    text=trimFalseStart(text);
    // Drop stray noise and single filler words picked up between sentences.
    if(text.replace(/[^a-z0-9]/gi,'').length<3){ resumeHold(); return; }
    if(!/\s/.test(text)&&FILLER.test(text.replace(/[^a-z0-9]/gi,''))){ resumeHold(); return; }

    // Whisper closes each fragment with . or ? — drop it when a continuation follows.
    pendingText=pendingText?pendingText.replace(/[.?!]+\s*$/,'')+' '+text:text;
    vstatus('LISTENING...');
    armHold();
  }

  // ---- playback: a Web Audio queue fed by "audio_chunk" frames ----
  // Chunks are scheduled back-to-back via a running start-time cursor so
  // sentence N+1 begins the instant sentence N ends, without gaps or clicks.
  let nextStartTime=0, scheduledSources=[];

  function resetPlayback(){
    scheduledSources.forEach(s=>{ try{s.stop();}catch(e){} });
    scheduledSources=[];
    nextStartTime=0;
  }

  function stopSpeaking(){
    speaking=false;
    resetPlayback();
  }

  // Stops audio already queued locally AND tells the server to stop
  // synthesizing the rest of this turn's reply (barge-in, sleep, cancel).
  function interruptSpeech(info){
    stopSpeaking();
    if(turnActive){
      dropAudio=true;
      if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(Object.assign({type:'cancel'},info||{}))+'\n');
    }
  }

  function playAudioChunk(base64pcm, sampleRate, isFinal){
    if(!audioContext)return;
    if(audioContext.state==='suspended')audioContext.resume();
    const raw=atob(base64pcm);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const floatData=new Float32Array(bytes.buffer);
    const buffer=audioContext.createBuffer(1, floatData.length, sampleRate||24000);
    buffer.copyToChannel(floatData,0);
    const source=audioContext.createBufferSource();
    source.buffer=buffer;
    source.connect(audioContext.destination);
    const startAt=Math.max(nextStartTime, audioContext.currentTime);
    source.start(startAt);
    nextStartTime=startAt+buffer.duration;
    scheduledSources.push(source);
    speaking=true;
    if(isFinal){
      source.onended=()=>{
        speaking=false;
        if(revertWhenIdle)revertSkillMode();
        if(recogWanted&&!asleep)vstatus('LISTENING');
      };
    }
  }

  // ---- capture: energy-based VAD + raw PCM, no SpeechRecognition ----
  // SpeechRecognition streams mic audio to Apple/Google even if you never
  // look at its transcript, so it can't be kept around just for its
  // endpointing signal — genuinely local/private STT means detecting
  // speech/silence ourselves. Uses ScriptProcessorNode (deprecated but
  // simple and universally supported) rather than an AudioWorklet module,
  // taps the same getUserMedia stream initAudio() already opened, and
  // outputs to a zero-gain node so raw mic input is never actually heard.
  // micStream is set on `window` by initAudio() in the module script above
  // (module scripts don't share top-level bindings with classic scripts);
  // referencing it here as a bare identifier resolves via the global object.
  let captureProcessor=null;
  let utteranceChunks=[], vadActive=false, vadSilenceStartMs=null;
  let vadCandidateChunks=[], vadCandidateBlocks=0, lastSpeechRms=0;
  const VAD_ENERGY_THRESHOLD=0.015;
  const VAD_SILENCE_MS=800;
  const VAD_MIN_UTTERANCE_MS=300;
  // A single loud block shouldn't cut SKYE off or start capturing — a
  // momentary echo leak (before acoustic echo cancellation converges, right
  // at the start of a session) or a click/cough looks identical to speech
  // for one block. Require this many consecutive speech-classified blocks
  // (~130-150ms at a 2048-sample block size) before committing.
  const VAD_CONFIRM_BLOCKS=3;
  // While SKYE itself is speaking, its own voice can leak back into the mic
  // even with echoCancellation on. That looked like the user talking and
  // cancelled the reply (and the short filler phrase, ~150 ms in). So an
  // interruption over SKYE's voice needs a louder, longer signal than starting
  // a fresh utterance. Each cancel reports its level to the server's
  // telemetry (cancel_info in logs/timing_*.jsonl) so these can be tuned.
  const VAD_BARGE_ENERGY=0.04;
  const VAD_BARGE_CONFIRM_BLOCKS=5;
  // Without a hard cap, an utterance that never gets a full silence gap
  // (e.g. background noise during "asleep", where the mic stays live by
  // design) accumulates forever and corrupts whatever comes next. Force a
  // flush well before this becomes a problem.
  const VAD_MAX_UTTERANCE_MS=15000;

  function resetVadState(){
    vadActive=false; utteranceChunks=[]; vadSilenceStartMs=null;
    vadCandidateChunks=[]; vadCandidateBlocks=0;
  }

  function rms(data){
    let sum=0; for(let i=0;i<data.length;i++)sum+=data[i]*data[i];
    return Math.sqrt(sum/data.length);
  }

  function downsampleTo16k(samples, origRate){
    if(origRate===16000)return samples;
    const ratio=origRate/16000;
    const newLen=Math.floor(samples.length/ratio);
    const result=new Float32Array(newLen);
    for(let i=0;i<newLen;i++){
      const srcIdx=i*ratio;
      const i0=Math.floor(srcIdx), i1=Math.min(i0+1, samples.length-1);
      const frac=srcIdx-i0;
      result[i]=samples[i0]*(1-frac)+samples[i1]*frac;
    }
    return result;
  }

  function floatTo16BitPCM(samples){
    const out=new Int16Array(samples.length);
    for(let i=0;i<samples.length;i++){
      const s=Math.max(-1,Math.min(1,samples[i]));
      out[i]=s<0?s*0x8000:s*0x7FFF;
    }
    return out;
  }

  function arrayBufferToBase64(buf){
    let binary='';
    const bytes=new Uint8Array(buf);
    const chunkSize=0x8000;
    for(let i=0;i<bytes.length;i+=chunkSize){
      binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunkSize));
    }
    return btoa(binary);
  }

  function finishUtterance(){
    const chunks=utteranceChunks;
    resetVadState();
    if(!chunks.length)return;
    const totalLen=chunks.reduce((a,c)=>a+c.length,0);
    const durMs=totalLen/audioContext.sampleRate*1000;
    if(durMs<VAD_MIN_UTTERANCE_MS){ resumeHold(); return; }   // too short, almost certainly noise

    const merged=new Float32Array(totalLen);
    let off=0; for(const c of chunks){ merged.set(c,off); off+=c.length; }
    const pcm16k=downsampleTo16k(merged, audioContext.sampleRate);
    const int16=floatTo16BitPCM(pcm16k);
    const b64=arrayBufferToBase64(int16.buffer);
    if(ws&&ws.readyState===WebSocket.OPEN){
      ws.send(JSON.stringify({type:'audio', pcm:b64, sample_rate:16000})+'\n');
    }
    if(!waiting)vstatus('PROCESSING...');
  }

  function handleAudioBlock(data){
    const level=rms(data);
    const overSkye=speaking&&!vadActive;   // could be an echo of SKYE's own voice
    const isSpeech=level>(overSkye?VAD_BARGE_ENERGY:VAD_ENERGY_THRESHOLD);
    const needBlocks=overSkye?VAD_BARGE_CONFIRM_BLOCKS:VAD_CONFIRM_BLOCKS;
    if(isSpeech)lastSpeechRms=Math.max(lastSpeechRms,level);
    if(isSpeech){
      if(!vadActive){
        // Not yet a confirmed utterance — buffer as a candidate so the
        // opening of the word isn't lost, but don't commit (and don't barge
        // in) until speech has actually been sustained for a few blocks.
        vadCandidateChunks.push(new Float32Array(data));
        vadCandidateBlocks++;
        if(vadCandidateBlocks>=needBlocks){
          // Barge-in: speech sustained while SKYE is talking means the user
          // is taking the floor, not a momentary echo leak (the
          // getUserMedia echoCancellation constraint handles the acoustic
          // side, but needs a moment to converge at the start of a session).
          if(speaking||turnActive){ interruptSpeech({reason:'barge-in', rms:+lastSpeechRms.toFixed(3), speaking:speaking, overSkye:overSkye}); vstatus('LISTENING'); }
          if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }   // user is continuing: keep waiting
          vadActive=true;
          utteranceChunks=vadCandidateChunks;
          vadCandidateChunks=[]; vadCandidateBlocks=0;
          vstatus('LISTENING...');
        }
      } else {
        utteranceChunks.push(new Float32Array(data));
      }
      vadSilenceStartMs=null;
    } else {
      lastSpeechRms=0;
      vadCandidateChunks=[]; vadCandidateBlocks=0;   // candidate run broken by silence
      if(vadActive){
        if(vadSilenceStartMs===null)vadSilenceStartMs=performance.now();
        utteranceChunks.push(new Float32Array(data));   // keep trailing silence for natural cadence
        if(performance.now()-vadSilenceStartMs>=VAD_SILENCE_MS)finishUtterance();
      }
    }
    if(vadActive){
      const durMs=utteranceChunks.reduce((a,c)=>a+c.length,0)/audioContext.sampleRate*1000;
      if(durMs>=VAD_MAX_UTTERANCE_MS)finishUtterance();
    }
  }

  function startCapture(){
    if(!audioContext||!micStream)return;
    const src=audioContext.createMediaStreamSource(micStream);
    captureProcessor=audioContext.createScriptProcessor(2048,1,1);
    const silentGain=audioContext.createGain();
    silentGain.gain.value=0;
    src.connect(captureProcessor);
    captureProcessor.connect(silentGain);
    silentGain.connect(audioContext.destination);
    captureProcessor.onaudioprocess=(e)=>handleAudioBlock(e.inputBuffer.getChannelData(0));
    vstatus('LISTENING');
  }

  function stopCapture(){
    if(captureProcessor){
      captureProcessor.onaudioprocess=null;
      try{ captureProcessor.disconnect(); }catch(e){}
      captureProcessor=null;
    }
    resetVadState();
  }

  window.startVoice=function(){ recogWanted=true; asleep=false; startCapture(); };
  window.stopVoice=function(){ recogWanted=false; stopCapture(); vstatus('MIC OFF'); };

  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
  });
</script>
</body>
</html>
